<div class="container-fluid anchor pb-5" id="{{ .section.id }}">
  <h1 class="text-center pt-4">{{ .section.name }}</h1>

  <div class="container">
    <div class="row g-3">

      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h4">관심 분야</h2>

            <ul>
              {{ range .interests }}
              <li class="mb-3">
                <strong>{{ .name }}</strong>
                <p>{{ .reason }}</p>
              </li>
              {{ end }}
            </ul>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h4">학습 목표</h2>

            <ul class="list-unstyled mb-0 ps-0">
              {{ range .goals }}
              <li class="border rounded-3 p-3 mb-3">
                <span class="d-block small fw-bold mb-1">목표</span>
                <h3 class="h6 mb-3">{{ .title }}</h3>
                <div class="border-top pt-2">
                  <span class="d-block small fw-bold mb-1">실행 계획</span>
                  <p class="mb-0">{{ .plan }}</p>
                </div>
              </li>
              {{ end }}
            </ul>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
