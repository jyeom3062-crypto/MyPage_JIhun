- name: "TMDB 영화 정보 웹사이트"
  image: "/images/projects/movie-lab.png"
  role: "Vue 프로젝트 실습 및 배포"
  timeline: "2026.10"
  repo: "https://github.com/jyeom3062-crypto/movie-lab-actions"
  demo: "https://jyeom3062-crypto.github.io/movie-lab-actions/"

  summary: >-
    수업에서 제공된 Vue 프로젝트를 기반으로 TMDB API를
    연동한 영화 정보 웹사이트를 실습했습니다.
    인기 영화 목록, 제목 검색, 페이지 이동 기능을 통해
    영화 포스터, 평점, 개봉일 및 줄거리를 확인할 수 있습니다.
    빌드 결과물을 GitHub Pages에 배포하고,
    GitHub Actions를 이용한 자동 배포 과정도 실습했습니다.
    이를 통해 Vue의 반응형 데이터 처리, REST API 요청,
    정적 웹사이트 배포와 CI/CD의 기본 구조를 학습했습니다.
    향후 장르별 필터링과 즐겨찾기 기능을 추가하고 싶습니다.

  tags:
    - "Vue"
    - "JavaScript"
    - "TMDB API"
    - "GitHub Actions"