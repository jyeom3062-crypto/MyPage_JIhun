- name: "TMDB 영화 정보 웹사이트"
  image: "/images/projects/movie-lab.png"
  role: "개인 실습 · 빌드 및 배포 / 배포 완료"
  timeline: "2026.10"
  repo: "https://github.com/jyeom3062-crypto/movie-lab-actions"
  demo: "https://jyeom3062-crypto.github.io/movie-lab-actions/"

  summary: >-
    Vue와 TMDB API를 연동해 인기 영화 목록,
    제목 검색, 페이지 이동 기능을 구현한
    영화 정보 웹사이트입니다.
    GitHub Pages와 Actions를 이용해
    배포를 완료했습니다.

  details: |-
    **주요 기능**

    - 인기 영화 목록 및 영화 상세 정보 조회
    - 영화 제목 검색과 페이지 이동
    - 포스터, 평점, 개봉일, 줄거리 표시

    **개발 과정 및 학습 내용**

    수업에서 제공된 Vue 프로젝트를 기반으로
    REST API 연동과 반응형 데이터 처리 방식을
    학습했습니다.

    정적 파일 빌드와 GitHub Pages 배포,
    GitHub Actions를 이용한 자동 배포 과정을
    실습했습니다.

    **향후 개선 계획**

    - 장르별 필터링 기능 추가
    - 즐겨찾기 기능 추가

