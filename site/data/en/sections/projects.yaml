projects:
- name: "TMDB 영화 정보 웹사이트"
  image: "/images/projects/movie-lab.png"
  role: "개인 실습 · 빌드 및 배포 / 배포 완료"
  timeline: "2026.10"
  repo: "https://github.com/jyeom3062-crypto/movie-lab-actions"
  demo: "https://jyeom3062-crypto.github.io/movie-lab-actions/"

  summary: >-
    Vue와 TMDB API를 활용한 영화 정보 웹사이트입니다.
    수업에서 제공된 프로젝트를 바탕으로
    정적 빌드와 GitHub Pages 배포를 수행하고,
    GitHub Actions 자동 배포 과정을 실습했습니다.

  details: |-
    **개발 목적**

    수업에서 제공된 Vue 기반 영화 정보 웹사이트를
    실제로 공개 배포하면서 프런트엔드 개발 환경,
    정적 파일 빌드, 자동 배포 과정을 학습하는 것을
    목표로 했습니다.

    **주요 기능**

    - TMDB API를 통한 인기 영화 목록 조회
    - 영화 제목 검색 및 페이지 이동
    - 포스터, 평점, 개봉일, 줄거리 표시
    - 로딩, 오류 및 검색 결과 없음 상태 처리

    위 기능은 수업에서 제공된 프로젝트를
    기반으로 구성되어 있습니다.

    **본인 수행 작업**

    - 프로젝트의 Vue 컴포넌트 및 API 호출 구조 학습
    - 로컬 개발 환경에서 프로젝트 실행 및 기능 확인
    - npm run build를 통한 정적 배포 파일 생성
    - GitHub Pages를 이용한 웹사이트 공개 배포
    - GitHub Actions를 이용한 자동 빌드·배포 실습
    - 배포된 웹사이트의 접속 및 기능 확인

    **기술 선택 및 활용 이유**

    Vue는 컴포넌트와 반응형 데이터를 이용해
    API 응답을 화면에 표시하는 구조를 학습하기
    위해 활용했습니다.

    GitHub Pages는 정적 웹사이트를 별도의
    서버 운영 없이 공개할 수 있어 사용했습니다.

    GitHub Actions는 소스 변경 이후 빌드와
    배포 과정을 자동화하는 방법을 익히기 위해
    활용했습니다.

    **결과 및 학습 내용**

    공개 웹사이트와 소스 코드 저장소를 구축하고
    수동 빌드와 자동 배포를 모두 실습했습니다.

    개발 서버에서 프로젝트를 실행하는 것과
    실제 배포 파일을 생성하여 공개하는 것의
    차이를 이해할 수 있었습니다.

    또한 GitHub Actions를 통해 반복적인
    배포 작업을 자동화하는 과정을 경험했습니다.

    **한계 및 향후 개선 계획**

    현재는 수업에서 제공된 기능을 중심으로
    구성되어 있어 개인화 기능이 제한적입니다.

    향후 장르별 필터링과 즐겨찾기 기능을
    추가해 사용자가 원하는 영화를 더욱 쉽게
    찾아볼 수 있도록 개선하고 싶습니다.

