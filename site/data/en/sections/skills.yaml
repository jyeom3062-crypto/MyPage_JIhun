# section information
section:
  name: Skills
  id: skills
  enable: true
  weight: 2
  showOnNavbar: true
  filter: false

skills:
  - name: C++
    summary: >-
      프로그래밍과 자료구조를 학습하며
      자료구조의 동작 원리를 코드로 이해하고,
      알고리즘 문제 해결에 활용했습니다.

  - name: Python
    summary: >-
      정렬, 탐색, 트리, 해시테이블 등의
      알고리즘을 구현하고 자료를 처리하는
      연습에 활용했습니다.

  - name: Java
    summary: >-
      클래스, 생성자, 상속, 다형성 등
      객체지향 프로그래밍의 핵심 개념을
      예제 코드 작성과 실행을 통해 학습했습니다.

  - name: Git & GitHub
    summary: >-
      Git 과제에서 커밋, 브랜치, 병합과
      충돌 해결을 실습했습니다.
      GitHub Actions를 활용한
      웹사이트 자동 배포도 경험했습니다.

  - name: Vue & JavaScript
    summary: >-
      수업에서 제공된 TMDB 영화 정보
      프로젝트를 활용해 Vue 컴포넌트와
      외부 REST API 연동 구조를 학습하고
      웹사이트를 빌드·배포했습니다.

  - name: Hugo · HTML · SCSS
    summary: >-
      Hugo와 Toha 테마를 활용해 개인
      포트폴리오를 제작했습니다.
      HTML 템플릿과 SCSS를 수정해
      프로젝트 카드, 반응형 배치,
      접근성 및 사용자 인터페이스를 개선했습니다.
