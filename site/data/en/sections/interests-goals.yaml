section:
  name: Interests & Goals
  id: interests-goals
  enable: true
  weight: 4
  showOnNavbar: true
  template: sections/interests-goals.html

interests:
  - name: "웹 서비스 개발"
    reason: "Vue와 외부 API를 활용해 실제로 동작하는 웹사이트를 만들어 보면서 웹 개발에 관심을 갖게 되었습니다."

  - name: "알고리즘과 자료구조"
    reason: "문제를 해결하는 여러 방법을 비교하고 더 효율적인 알고리즘을 찾는 과정에 흥미가 있습니다."

  - name: "AI 기술"
    reason: "인공지능이 실제 소프트웨어와 서비스에 어떻게 활용되는지 배우고 싶습니다."

goals:
  - "목표: Vue와 TypeScript를 활용한 웹서비스 제작. 실행 계획: 컴포넌트를 분리한 간단한 웹서비스를 구현하고 GitHub에 배포하기."

  - "목표: Firebase Firestore 학습. 실행 계획: 데이터 추가, 조회, 수정, 삭제 기능을 직접 구현하기."

  - "목표: GitHub를 활용한 개발 능력 향상. 실행 계획: 기능별 브랜치를 생성하고 병합하는 과정을 프로젝트에 적용하기."

  - "목표: 알고리즘과 자료구조 응용. 실행 계획: 정렬과 탐색 알고리즘의 동작 및 성능을 비교하고 실제 코드에 적용하기."